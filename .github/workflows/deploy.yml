name: deploy

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      plan_database_migrations:
        description: "Show the protected production migration plan without changing the database or deploying the application"
        required: true
        type: boolean
        default: false
      apply_database_migrations:
        description: "Run the protected production database release even when this is a manual rerun"
        required: true
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.101.0
  PUBLIC_ORIGIN: https://nalanda.online

jobs:
  quality:
    name: Lint, typecheck, tests, and build
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    outputs:
      migrations_changed: ${{ steps.migration_changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Detect and protect migration changes
        id: migration_changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          MANUAL_DB_PLAN: ${{ inputs.plan_database_migrations || false }}
          MANUAL_DB_RELEASE: ${{ inputs.apply_database_migrations || false }}
        run: |
          set -Eeuo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "$MANUAL_DB_PLAN" == "true" && "$MANUAL_DB_RELEASE" == "true" ]]; then
              echo "Choose either plan_database_migrations or apply_database_migrations, not both." >&2
              exit 2
            fi
            if [[ "$MANUAL_DB_PLAN" == "true" || "$MANUAL_DB_RELEASE" == "true" ]]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          base="$BEFORE_SHA"
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            empty_tree="$(git hash-object -t tree /dev/null)"
            base="$empty_tree"
          fi

          migration_changes="$(git diff --name-status "$base" "$GITHUB_SHA" -- supabase/migrations)"
          release_control_changes="$(git diff --name-status "$base" "$GITHUB_SHA" -- \
            .github/workflows/deploy.yml \
            scripts/create-db-release-backup.sh \
            scripts/create-db-release-backup.test.mjs \
            scripts/restore-db-release.sh \
            scripts/prepare-production-migration-baseline.sh \
            scripts/verify-production-migration-baseline.mjs \
            scripts/verify-production-migration-baseline.test.mjs)"
          if [[ -z "$migration_changes" && -z "$release_control_changes" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "$migration_changes" ]]; then
            echo "$migration_changes"
            if ! awk '$1 != "A" { exit 1 }' <<< "$migration_changes"; then
              echo "Existing migration files are immutable; add a new forward migration." >&2
              exit 1
            fi
          fi
          if [[ -n "$release_control_changes" ]]; then
            echo "Production database release controls changed:"
            echo "$release_control_changes"
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "::warning::Production release is blocked. Run workflow_dispatch with plan_database_migrations=true, review the plan, then run a separate apply_database_migrations=true execution for this main commit."
            {
              echo "### Production release pending"
              echo
              echo "Database migrations or protected release controls changed. On this main commit, run \`plan_database_migrations=true\`, review history/dry-run, then run a separate \`apply_database_migrations=true\` execution to create a recovery point and complete the protected database release before deploying the application."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Documentation checks
        run: pnpm docs:check

      - name: Production release tooling tests
        run: pnpm test:release

      - name: Code lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and jsdom tests
        run: pnpm test
        env:
          REDIS_URL: redis://127.0.0.1:6379/15
          RATE_LIMIT_HMAC_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          RUN_REDIS_E2E: "true"

      - name: Build all workspaces
        run: pnpm build

      - name: Build and boot production API image
        shell: bash
        run: |
          set -Eeuo pipefail
          image=nalanda-api:ci
          container=nalanda-api-ci
          health_file="$RUNNER_TEMP/nalanda-api-ci-health.json"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker build -f infra/hybrid-2g/api.Dockerfile -t "$image" .
          docker run --rm --entrypoint node "$image" -e \
            "require.resolve('express'); require.resolve('@nalanda/types'); require.resolve('ioredis')"
          docker run -d --name "$container" -p 127.0.0.1:18411:3000 "$image"

          for attempt in $(seq 1 30); do
            if curl -sS --max-time 2 -o "$health_file" http://127.0.0.1:18411/api/health && \
              node -e '
                const fs = require("node:fs");
                const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                if (value.status !== "error" || value.service !== "nalanda-api" || value.deps?.supabase !== "unavailable" || value.deps?.redis !== "unavailable") process.exit(1);
              ' "$health_file" 2>/dev/null; then
              exit 0
            fi
            if [[ "$attempt" == "30" ]]; then
              docker logs "$container" >&2
              exit 1
            fi
            sleep 1
          done

      - name: Validate production compose and nginx rate-limit configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          fixture="$RUNNER_TEMP/nalanda-compose"
          mkdir -p "$fixture"
          cp infra/deploy/docker-compose.yml "$fixture/docker-compose.yml"
          printf 'NALANDA_API_IMAGE=nalanda-api:ci\n' > "$fixture/.deploy.env"
          printf 'REDIS_PASSWORD=%064d\n' 0 > "$fixture/.redis.env"
          {
            printf 'REDIS_URL=redis://:%064d@redis:6379/0\n' 0
            printf 'RATE_LIMIT_HMAC_SECRET=%064d\n' 1
          } > "$fixture/.env"
          docker compose --env-file "$fixture/.deploy.env" -f "$fixture/docker-compose.yml" config >/dev/null
          docker run --rm \
            -v "$PWD/infra/deploy/nginx-rate-limit.conf:/etc/nginx/conf.d/00-nalanda-rate-limit.conf:ro" \
            -v "$PWD/infra/deploy/nginx.nalanda.conf:/etc/nginx/conf.d/nalanda.conf:ro" \
            nginx:1.27-alpine nginx -t

  migration_validation:
    name: Rebuild, lint, and RLS-test local Supabase
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Exercise the 0007 to latest data upgrade, then rebuild from scratch
        shell: bash
        run: |
          set -Eeuo pipefail

          # `supabase start` eagerly applies every migration. Discover and stage
          # every migration from 0008 onward so future 0011+ files cannot leak
          # into the 0007 fixture before the upgrade assertion runs.
          mapfile -t upgrade_migrations < <(
            find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print \
              | LC_ALL=C sort \
              | awk -F/ '$NF >= "20260710000008"'
          )
          [[ "${#upgrade_migrations[@]}" -gt 0 ]] || { echo "No 0008+ migrations found" >&2; exit 2; }
          staged_upgrade_dir="$RUNNER_TEMP/nalanda-points-upgrade"
          staged_security_dir="$RUNNER_TEMP/nalanda-security-upgrade"
          mkdir -p "$staged_upgrade_dir"
          mkdir -p "$staged_security_dir"
          security_migrations=()
          restore_upgrade_migrations() {
            local migration staged
            for migration in "${upgrade_migrations[@]}"; do
              staged="$staged_upgrade_dir/$(basename "$migration")"
              if [[ -f "$staged" ]]; then
                mv -- "$staged" "$migration"
              fi
            done
          }
          restore_security_migrations() {
            local migration staged
            for migration in "${security_migrations[@]}"; do
              staged="$staged_security_dir/$(basename "$migration")"
              if [[ -f "$staged" ]]; then
                mv -- "$staged" "$migration"
              fi
            done
          }
          restore_all_upgrade_migrations() {
            restore_upgrade_migrations
            restore_security_migrations
          }
          trap restore_all_upgrade_migrations EXIT
          for migration in "${upgrade_migrations[@]}"; do
            [[ -f "$migration" ]] || { echo "Missing upgrade migration: $migration" >&2; exit 2; }
            mv -- "$migration" "$staged_upgrade_dir/$(basename "$migration")"
          done

          supabase start

          status_file="$RUNNER_TEMP/supabase-status.env"
          supabase status -o env > "$status_file"
          set -a
          source "$status_file"
          set +a

          fixture="$RUNNER_TEMP/nalanda-points-upgrade.json"
          # Resetting while 0008 is staged out guarantees a clean 0001–0007
          # schema even on CLI versions that start by applying all migrations.
          supabase db reset --local --no-seed
          ALLOW_POINTS_UPGRADE_E2E=YES \
          POINTS_UPGRADE_FIXTURE="$fixture" \
          SUPABASE_URL="$API_URL" \
          SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          node apps/web/tests/points-upgrade.e2e.mjs seed

          restore_upgrade_migrations
          mapfile -t security_migrations < <(
            find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print \
              | LC_ALL=C sort \
              | awk -F/ '$NF >= "20260810000039"'
          )
          [[ "${#security_migrations[@]}" -gt 0 ]] || { echo "No 0039+ migrations found" >&2; exit 2; }
          for migration in "${security_migrations[@]}"; do
            mv -- "$migration" "$staged_security_dir/$(basename "$migration")"
          done

          # First reach the exact 0038 production baseline, then create the
          # historical edge where a 0008 placeholder is cancelled without ever
          # having received a per-business positive entry.
          supabase migration up --local
          ALLOW_POINTS_UPGRADE_E2E=YES \
          POINTS_UPGRADE_FIXTURE="$fixture" \
          SUPABASE_URL="$API_URL" \
          SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          node apps/web/tests/points-upgrade.e2e.mjs mutate

          restore_security_migrations
          supabase migration up --local
          ALLOW_POINTS_UPGRADE_E2E=YES \
          POINTS_UPGRADE_FIXTURE="$fixture" \
          SUPABASE_URL="$API_URL" \
          SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          node apps/web/tests/points-upgrade.e2e.mjs assert

          # Destroy the upgrade fixture stack and create a fresh empty-volume
          # stack for RLS/browser validation. Reusing the same stack for a
          # second db reset can leave Auth behind Kong returning 502 even after
          # the CLI reports that container restart as complete.
          supabase stop --no-backup
          supabase start

      - name: Lint database functions
        run: supabase db lint --local --schema public --level error --fail-on error

      - name: Run real RLS and Storage E2E against local Supabase
        shell: bash
        run: |
          set -Eeuo pipefail
          status_file="$RUNNER_TEMP/supabase-status.env"
          supabase status -o env > "$status_file"
          set -a
          source "$status_file"
          set +a
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 2 -o /dev/null "$API_URL/auth/v1/health" && \
               curl -fsS --max-time 2 -o /dev/null -H "apikey: $ANON_KEY" "$API_URL/rest/v1/"; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "Local Supabase Auth/PostgREST did not become ready after database reset." >&2
              exit 1
            fi
            sleep 2
          done
          SUPABASE_URL="$API_URL" \
          SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          SUPABASE_RLS_E2E_CONFIRM_REF="127" \
          pnpm test:rls

      - name: Install Playwright Chromium
        run: pnpm --filter @nalanda/web exec playwright install --with-deps chromium

      - name: Run browser course workflow against local Supabase
        shell: bash
        run: |
          set -Eeuo pipefail
          status_file="$RUNNER_TEMP/supabase-status.env"
          supabase status -o env > "$status_file"
          set -a
          source "$status_file"
          set +a
          SUPABASE_URL="$API_URL" \
          SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          SUPABASE_JWT_SECRET="$JWT_SECRET" \
          VITE_SUPABASE_URL="$API_URL" \
          VITE_SUPABASE_ANON_KEY="$ANON_KEY" \
          FEATURE_LEARNING_COURSES_ENABLED=true \
          FEATURE_COURSE_SHARING_ENABLED=true \
          FEATURE_COURSE_MARKET_ENABLED=true \
          FEATURE_PRONUNCIATION_ENABLED=true \
          FEATURE_LEARNING_AUDIO_PREWARM_ENABLED=true \
          FEATURE_SPELLING_TRANSLATION_ASSESSMENT_ENABLED=true \
          AZURE_SPEECH_FAKE=true \
          OPENROUTER_FAKE=true \
          REDIS_URL=redis://127.0.0.1:6379/14 \
          RATE_LIMIT_HMAC_SECRET=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
          POINT_ABUSE_SCANNER_ENABLED=false \
          PUBLIC_ORIGIN=http://127.0.0.1:5173 \
          pnpm --filter @nalanda/web test:playwright

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  database_release:
    name: Plan or migrate production database
    needs: [quality, migration_validation]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      (inputs.plan_database_migrations == true || inputs.apply_database_migrations == true) &&
      needs.quality.outputs.migrations_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production-database
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Validate protected database inputs
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.DB_BACKUP_ENCRYPTION_KEY }}
          EXPECTED_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          set -Eeuo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF BACKUP_ENCRYPTION_KEY EXPECTED_SUPABASE_URL; do
            [[ -n "${!name:-}" ]] || { echo "Missing protected input: $name" >&2; exit 2; }
          done
          [[ "$EXPECTED_SUPABASE_URL" == "https://${SUPABASE_PROJECT_REF}.supabase.co" ]] || {
            echo "SUPABASE_PROJECT_REF does not match the Web production Supabase URL" >&2
            exit 2
          }

      - name: Link project and show migration plan
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -Eeuo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase migration list --linked
          supabase db push --linked --dry-run

      - name: Create encrypted pre-migration recovery point
        if: inputs.apply_database_migrations == true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.DB_BACKUP_ENCRYPTION_KEY }}
          BACKUP_OUTPUT: ${{ runner.temp }}/nalanda-db-${{ github.sha }}.tar.gz.enc
        run: bash scripts/create-db-release-backup.sh

      - name: Retain encrypted recovery point
        if: inputs.apply_database_migrations == true
        uses: actions/upload-artifact@v4
        with:
          name: db-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/nalanda-db-${{ github.sha }}.tar.gz.enc
          if-no-files-found: error
          retention-days: 14

      - name: Verify and establish the reviewed production migration baseline
        if: inputs.apply_database_migrations == true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: bash scripts/prepare-production-migration-baseline.sh

      - name: Apply forward migrations
        if: inputs.apply_database_migrations == true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked

      - name: Verify remote migration history and functions
        if: inputs.apply_database_migrations == true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -Eeuo pipefail
          supabase migration list --linked
          supabase db push --linked --dry-run
          supabase db lint --linked --schema public --level error --fail-on error

  deploy_application:
    name: Deploy immutable application release
    needs: [quality, migration_validation, database_release]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.quality.result == 'success' &&
      needs.migration_validation.result == 'success' &&
      (
        needs.quality.outputs.migrations_changed != 'true' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.apply_database_migrations == true &&
          needs.database_release.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://nalanda.online
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Web with production public configuration
        run: pnpm --filter @nalanda/web build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build immutable API image
        run: docker build -f infra/hybrid-2g/api.Dockerfile -t "nalanda-api:${GITHUB_SHA}" .

      - name: Package artifacts
        run: |
          set -Eeuo pipefail
          docker save "nalanda-api:${GITHUB_SHA}" | gzip > nalanda-api.tar.gz
          tar -C apps/web/dist -czf web.tgz .
          gzip -t nalanda-api.tar.gz
          tar -tzf web.tgz >/dev/null

      - name: Validate and install SSH trust
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          for name in SERVER_HOST SERVER_USER SERVER_SSH_KEY SERVER_SSH_KNOWN_HOSTS; do
            [[ -n "${!name:-}" ]] || { echo "Missing deployment secret: $name" >&2; exit 2; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SERVER_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -F "$SERVER_HOST" -f ~/.ssh/known_hosts >/dev/null || {
            echo "SERVER_SSH_KNOWN_HOSTS has no entry for SERVER_HOST" >&2
            exit 2
          }

      - name: Upload release to an isolated incoming directory
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 \
            "$SERVER_USER@$SERVER_HOST" "install -d -m 700 /opt/nalanda/incoming/${GITHUB_SHA}"
          scp -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 \
            nalanda-api.tar.gz web.tgz infra/deploy/docker-compose.yml \
            infra/deploy/nginx-rate-limit.conf \
            scripts/smoke-azure-speech.mjs scripts/smoke-learning-audio-production.mjs \
            scripts/learning-audio-smoke-lib.mjs \
            scripts/smoke-openrouter-translation.mjs \
            scripts/openrouter-translation-smoke-lib.mjs \
            scripts/install-production-openrouter-env.sh \
            scripts/install-production-security-env.sh \
            scripts/install-production-nginx-rate-limits.sh \
            "$SERVER_USER@$SERVER_HOST:/opt/nalanda/incoming/${GITHUB_SHA}/"

      - name: Install the protected OpenRouter runtime configuration
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -Eeuo pipefail
          [[ -n "$OPENROUTER_API_KEY" ]] || {
            echo "Missing protected input: OPENROUTER_API_KEY" >&2
            exit 2
          }
          printf '%s\n' "$OPENROUTER_API_KEY" |
            ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 \
              "$SERVER_USER@$SERVER_HOST" \
              "bash /opt/nalanda/incoming/${GITHUB_SHA}/install-production-openrouter-env.sh /opt/nalanda"

      - name: Install protected Redis and rate-limit runtime secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          RATE_LIMIT_HMAC_SECRET: ${{ secrets.RATE_LIMIT_HMAC_SECRET }}
        run: |
          set -Eeuo pipefail
          [[ "$REDIS_PASSWORD" =~ ^[0-9a-fA-F]{64}$ ]] || {
            echo "Missing or invalid protected input: REDIS_PASSWORD" >&2
            exit 2
          }
          [[ "$RATE_LIMIT_HMAC_SECRET" =~ ^[0-9a-fA-F]{64}$ ]] || {
            echo "Missing or invalid protected input: RATE_LIMIT_HMAC_SECRET" >&2
            exit 2
          }
          printf '%s\n%s\n' "$REDIS_PASSWORD" "$RATE_LIMIT_HMAC_SECRET" |
            ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 \
              "$SERVER_USER@$SERVER_HOST" \
              "bash /opt/nalanda/incoming/${GITHUB_SHA}/install-production-security-env.sh /opt/nalanda"

      - name: Activate release and automatically roll back application on failure
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 \
            "$SERVER_USER@$SERVER_HOST" bash -se -- "$GITHUB_SHA" "$RELEASE_ID" "$PUBLIC_ORIGIN" <<'REMOTE'
          set -Eeuo pipefail

          sha="$1"
          release_id="$2"
          public_origin="$3"
          root=/opt/nalanda
          incoming="$root/incoming/$sha"
          release="$root/releases/$release_id"
          next_compose="$root/docker-compose.yml.next-$release_id"
          next_env="$root/.deploy.env.next-$release_id"
          previous_compose="$incoming/docker-compose.previous.yml"

          assert_api_health() {
            local endpoint="$1"
            local payload
            payload="$(curl -fsS --max-time 10 "$endpoint")" || return 1
            python3 -c '
          import json, sys
          value = json.load(sys.stdin)
          assert value.get("status") == "ok"
          assert value.get("service") == "nalanda-api"
          assert value.get("deps", {}).get("supabase") == "ok"
          assert value.get("deps", {}).get("redis") == "ok"
          ' <<< "$payload"
          }

          # Rollback may restore an older image whose health payload predates
          # dependency-level readiness. Verify that the previous API process
          # and contract are back without weakening checks for the new release.
          assert_api_process_health() {
            local endpoint="$1"
            local payload
            payload="$(curl -fsS --max-time 10 "$endpoint")" || return 1
            python3 -c '
          import json, sys
          value = json.load(sys.stdin)
          assert value.get("status") == "ok"
          assert value.get("service") == "nalanda-api"
          ' <<< "$payload"
          }

          assert_auth_guard() {
            local endpoint="$1"
            local status
            status="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "$endpoint")" || return 1
            [[ "$status" == "401" ]]
          }

          assert_rate_limit_headers() {
            local endpoint="$1"
            local headers status
            headers="$(mktemp)"
            status="$(curl -sS --max-time 10 -D "$headers" -o /dev/null -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              --data '{}' "$endpoint")" || {
                rm -f "$headers"
                return 1
              }
            grep -qi '^ratelimit-limit:' "$headers" \
              && grep -qi '^ratelimit-remaining:' "$headers" \
              && [[ "$status" == "400" ]]
            local result=$?
            rm -f "$headers"
            return "$result"
          }

          wait_for_api() {
            local endpoint="$1"
            local verifier="${2:-assert_api_health}"
            local attempt
            for attempt in $(seq 1 30); do
              if "$verifier" "$endpoint"; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          current_container="$(
            docker ps -aq \
              --filter label=com.docker.compose.project=nalanda \
              --filter label=com.docker.compose.service=api \
              | head -n 1
          )"
          previous_image=""
          if [[ -n "$current_container" ]]; then
            previous_image="$(docker inspect --format '{{.Config.Image}}' "$current_container")"
          fi

          if [[ -f "$root/docker-compose.yml" ]]; then
            cp "$root/docker-compose.yml" "$previous_compose"
          fi
          previous_web=""
          if [[ -L "$root/web" ]]; then
            previous_web="$(readlink -f "$root/web")"
          elif [[ -d "$root/web" ]]; then
            legacy="$root/releases/legacy-$(date -u +%Y%m%dT%H%M%SZ)"
            mkdir -p "$legacy"
            mv "$root/web" "$legacy/web"
            ln -s "$legacy/web" "$root/web"
            previous_web="$legacy/web"
          fi

          rollback_application() {
            local reason="$1"
            echo "Application release failed: $reason" >&2

            if [[ -n "$previous_web" && -d "$previous_web" ]]; then
              rm -f "$root/web.rollback"
              ln -s "$previous_web" "$root/web.rollback"
              mv -Tf "$root/web.rollback" "$root/web"
            fi

            if [[ -n "$previous_image" && -f "$previous_compose" ]]; then
              printf 'NALANDA_API_IMAGE=%s\n' "$previous_image" > "$root/.deploy.env.rollback"
              cp "$previous_compose" "$root/docker-compose.yml.rollback"
              docker compose \
                --env-file "$root/.deploy.env.rollback" \
                -f "$root/docker-compose.yml.rollback" \
                up -d --force-recreate api
              mv "$root/docker-compose.yml.rollback" "$root/docker-compose.yml"
              mv "$root/.deploy.env.rollback" "$root/.deploy.env"
              wait_for_api http://127.0.0.1:8411/api/health assert_api_process_health || {
                echo "Previous API also failed health verification; manual intervention required." >&2
                return 1
              }
              assert_auth_guard http://127.0.0.1:8411/api/me || {
                echo "Previous API failed auth guard verification; manual intervention required." >&2
                return 1
              }
              echo "Previous Web/API release restored."
              return 0
            fi

            echo "No previous API image was available for automatic rollback." >&2
            return 1
          }

          [[ -s "$incoming/nalanda-api.tar.gz" ]]
          [[ -s "$incoming/web.tgz" ]]
          [[ -s "$incoming/docker-compose.yml" ]]
          [[ -s "$incoming/nginx-rate-limit.conf" ]]
          [[ -s "$incoming/smoke-azure-speech.mjs" ]]
          [[ -s "$incoming/smoke-learning-audio-production.mjs" ]]
          [[ -s "$incoming/learning-audio-smoke-lib.mjs" ]]
          [[ -s "$incoming/smoke-openrouter-translation.mjs" ]]
          [[ -s "$incoming/openrouter-translation-smoke-lib.mjs" ]]
          [[ -s "$incoming/install-production-openrouter-env.sh" ]]
          [[ -s "$incoming/install-production-security-env.sh" ]]
          [[ -s "$incoming/install-production-nginx-rate-limits.sh" ]]
          gzip -t "$incoming/nalanda-api.tar.gz"
          tar -tzf "$incoming/web.tgz" >/dev/null

          mkdir -p "$release/web"
          tar -C "$release/web" -xzf "$incoming/web.tgz"
          cp "$incoming/docker-compose.yml" "$next_compose"
          printf 'NALANDA_API_IMAGE=nalanda-api:%s\n' "$sha" > "$next_env"
          gunzip -c "$incoming/nalanda-api.tar.gz" | docker load

          # Redis starts before the new API and remains available across an
          # application rollback. It has no published host port, requires a
          # password, persists AOF every second and fails readiness unless PING
          # succeeds from inside the container network.
          docker compose --env-file "$next_env" -f "$next_compose" up -d redis
          redis_healthy=false
          for attempt in $(seq 1 30); do
            redis_container="$(docker compose --env-file "$next_env" -f "$next_compose" ps -q redis)"
            if [[ -n "$redis_container" ]] \
              && [[ "$(docker inspect --format '{{.State.Health.Status}}' "$redis_container")" == "healthy" ]]; then
              redis_healthy=true
              break
            fi
            sleep 2
          done
          [[ "$redis_healthy" == true ]] || {
            docker compose --env-file "$next_env" -f "$next_compose" logs --tail=100 redis || true
            echo "Redis failed protected startup" >&2
            exit 1
          }
          [[ -z "$(docker inspect --format '{{json .NetworkSettings.Ports}}' "$redis_container" | grep -o 'HostPort' || true)" ]]
          docker compose --env-file "$next_env" -f "$next_compose" exec -T redis sh -ec \
            'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -qx PONG; test "$(REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli CONFIG GET appendonly | tail -n1)" = yes; test "$(REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli CONFIG GET maxmemory-policy | tail -n1)" = noeviction' \
            </dev/null
          echo "Redis protected startup verified (PING, AOF, private port, noeviction)."

          bash "$incoming/install-production-nginx-rate-limits.sh" \
            "$incoming/nginx-rate-limit.conf" /etc/nginx/sites-available/nalanda

          # The live Azure credential remains only in the production host's
          # mode-600 .env. Validate TTS + pronunciation assessment from the new
          # runtime before switching either the API container or Web symlink.
          if ! docker run --rm \
            --env-file "$root/.env" \
            --entrypoint node \
            -v "$incoming/smoke-azure-speech.mjs:/tmp/smoke-azure-speech.mjs:ro" \
            "nalanda-api:$sha" /tmp/smoke-azure-speech.mjs; then
            echo "Real Azure Speech smoke failed; the new release was not activated." >&2
            exit 1
          fi

          # The semantic spelling gate is also a real provider dependency.
          # Validate the pinned model and structured-output contract before
          # activating the API/Web release; no key or provider body is printed.
          if ! docker run --rm \
            --env-file "$root/.env" \
            --entrypoint node \
            -v "$incoming/smoke-openrouter-translation.mjs:/tmp/smoke-openrouter-translation.mjs:ro" \
            -v "$incoming/openrouter-translation-smoke-lib.mjs:/tmp/openrouter-translation-smoke-lib.mjs:ro" \
            "nalanda-api:$sha" /tmp/smoke-openrouter-translation.mjs; then
            echo "Real OpenRouter translation smoke failed; the new release was not activated." >&2
            exit 1
          fi

          if ! docker compose --env-file "$next_env" -f "$next_compose" up -d --force-recreate api; then
            rollback_application "docker compose failed" || true
            exit 1
          fi
          if ! wait_for_api http://127.0.0.1:8411/api/health; then
            docker compose --env-file "$next_env" -f "$next_compose" logs --tail=100 api || true
            rollback_application "local API health check failed" || true
            exit 1
          fi
          if ! assert_auth_guard http://127.0.0.1:8411/api/me; then
            rollback_application "local auth guard smoke check failed" || true
            exit 1
          fi
          if ! assert_auth_guard http://127.0.0.1:8411/api/admin/points/abuse-signals; then
            rollback_application "local points admin auth smoke check failed" || true
            exit 1
          fi
          if ! assert_rate_limit_headers http://127.0.0.1:8411/api/auth/register; then
            rollback_application "local rate-limit header smoke check failed" || true
            exit 1
          fi
          if ! docker run --rm \
            --network host \
            --env-file "$root/.env" \
            -e SMOKE_API_ORIGIN=http://127.0.0.1:8411/api \
            --entrypoint node \
            -v "$incoming/smoke-learning-audio-production.mjs:/tmp/smoke-learning-audio-production.mjs:ro" \
            -v "$incoming/learning-audio-smoke-lib.mjs:/tmp/learning-audio-smoke-lib.mjs:ro" \
            "nalanda-api:$sha" /tmp/smoke-learning-audio-production.mjs; then
            rollback_application "real queued audio/Storage/assessment gate failed" || true
            exit 1
          fi

          if ! {
            mv "$next_compose" "$root/docker-compose.yml"
            mv "$next_env" "$root/.deploy.env"
            rm -f "$root/web.next"
            ln -s "$release/web" "$root/web.next"
            mv -Tf "$root/web.next" "$root/web"
          }; then
            rollback_application "release activation failed" || true
            exit 1
          fi

          external_ok=false
          for attempt in $(seq 1 15); do
            web_payload="$(curl -fsS --max-time 10 "$public_origin/" || true)"
            if assert_api_health "$public_origin/api/health" \
              && assert_auth_guard "$public_origin/api/me" \
              && assert_auth_guard "$public_origin/api/admin/points/abuse-signals" \
              && grep -q '<div id="root"></div>' <<< "$web_payload"; then
              external_ok=true
              break
            fi
            sleep 2
          done
          if [[ "$external_ok" != true ]]; then
            rollback_application "external API/Web smoke check failed" || true
            exit 1
          fi
          if ! assert_rate_limit_headers "$public_origin/api/auth/register"; then
            rollback_application "external rate-limit header smoke check failed" || true
            exit 1
          fi

          rm -rf "$incoming"
          docker image prune -f >/dev/null 2>&1 || true
          echo "Release $release_id is healthy and active."
          REMOTE
