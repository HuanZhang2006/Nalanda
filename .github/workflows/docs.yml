name: docs

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check-docs.mjs"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "scripts/check-docs.mjs"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-docs.mjs
