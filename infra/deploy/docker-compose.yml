# 服务器端运行用（部署到 /opt/nalanda/docker-compose.yml，由 CI 同步）
# 运行后端 API、内部 Materials AI worker 与仅容器内网可达的 Redis；
# 前端静态文件由宿主机 nginx 托管。仅 API 绑定 127.0.0.1:8411。

name: nalanda

services:
  api:
    # CI 通过 .deploy.env 注入不可变 Git SHA；缺失时直接失败，避免误启 latest。
    image: ${NALANDA_API_IMAGE:?run docker compose with --env-file .deploy.env}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
    depends_on:
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy
    dns:                         # 宿主机用 systemd-resolved(127.0.0.53)，容器内解析不到，显式指定
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "127.0.0.1:8411:3000"
    mem_limit: 256m
    mem_reservation: 128m

  ai:
    # AI worker has a separate least-privilege environment and never receives
    # the Supabase service-role key, Azure key, Redis password, or Web secrets.
    image: ${NALANDA_AI_IMAGE:?run docker compose with --env-file .deploy.env}
    restart: unless-stopped
    env_file: .ai.env
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          value=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5));
          assert value.get('status') == 'ok'
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
    mem_limit: 640m
    mem_reservation: 384m
    memswap_limit: 896m
    cpus: 0.75
    pids_limit: 128
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Deliberately separate from API .env so Redis never receives Supabase or
    # provider credentials.
    env_file: .redis.env
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$${REDIS_PASSWORD}" --maxmemory 48mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - redis_data:/data
    mem_limit: 96m
    mem_reservation: 48m
    security_opt:
      - no-new-privileges:true

volumes:
  redis_data:
