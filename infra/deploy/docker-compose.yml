# 服务器端运行用（部署到 /opt/nalanda/docker-compose.yml，由 CI 同步）
# 仅跑后端 api；前端是静态文件由宿主机 nginx 托管；redis/ai 暂未启用。
# api 仅绑定 127.0.0.1:8411，对外由 nginx 反代 nalanda.online → /api。

name: nalanda

services:
  api:
    # CI 通过 .deploy.env 注入不可变 Git SHA；缺失时直接失败，避免误启 latest。
    image: ${NALANDA_API_IMAGE:?run docker compose with --env-file .deploy.env}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
    dns:                         # 宿主机用 systemd-resolved(127.0.0.53)，容器内解析不到，显式指定
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "127.0.0.1:8411:3000"
    mem_limit: 256m
    mem_reservation: 128m
