# Loaded from nginx's http context (for example /etc/nginx/conf.d).
# Do not log request keys; nginx stores only an in-memory binary IP key.
limit_req_zone $binary_remote_addr zone=nalanda_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=nalanda_register:1m rate=1r/s;
limit_req_status 429;
