# 宿主机 nginx 的 nalanda.online 站点（参考副本）。
# 实际文件在服务器 /etc/nginx/sites-available/nalanda；TLS（443 + 跳转）由 certbot 自动注入。
# 与既有站点（uofa.ink 等）互不影响：独立 server_name + 独立证书。

server {
    listen 80;
    listen [::]:80;
    server_name nalanda.online;

    root /opt/nalanda/web;       # CI 同步的前端静态产物
    index index.html;

    location /api/ {             # 反代到本机后端容器（NestJS 全局前缀 /api）
        proxy_pass http://127.0.0.1:8411;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {                 # SPA 路由回退
        try_files $uri $uri/ /index.html;
    }
}
