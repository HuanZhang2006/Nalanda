# Host nginx site for nalanda.online (reference copy).
# The live file is /etc/nginx/sites-available/nalanda on the server; certbot injects TLS (443 + redirect) automatically.
# Isolated from existing sites (uofa.ink, etc.): separate server_name and certificate.

server {
    listen 80;
    listen [::]:80;
    server_name nalanda.online;

    root /opt/nalanda/web;       # Static frontend build synced by CI
    index index.html;

    location = /api/auth/register {
        limit_req zone=nalanda_register burst=3 nodelay;
        error_page 429 = @nalanda_register_limited;
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:8411;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {             # Reverse proxy to the local backend container (NestJS global prefix /api)
        limit_req zone=nalanda_api burst=40 nodelay;
        error_page 429 = @nalanda_api_limited;
        client_max_body_size 10m; # 2,000-word course JSON; the API still limits WAV uploads to 2 MB
        proxy_pass http://127.0.0.1:8411;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # nginx-generated limits use the same machine-readable contract as Nest.
    # Upstream 429 responses are not intercepted, so their exact Retry-After
    # and per-user RateLimit headers remain intact.
    location @nalanda_register_limited {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "1" always;
        add_header RateLimit-Limit "1" always;
        add_header RateLimit-Remaining "0" always;
        add_header RateLimit-Reset "1" always;
        return 429 '{"code":"RATE_LIMITED","message":"Too many requests","retryAfterSeconds":1}';
    }

    location @nalanda_api_limited {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "1" always;
        add_header RateLimit-Limit "20" always;
        add_header RateLimit-Remaining "0" always;
        add_header RateLimit-Reset "1" always;
        return 429 '{"code":"RATE_LIMITED","message":"Too many requests","retryAfterSeconds":1}';
    }

    location / {                 # SPA route fallback
        try_files $uri $uri/ /index.html;
    }
}
