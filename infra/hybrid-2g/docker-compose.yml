# Nalanda — 2 GB hybrid deployment (architecture doc §12.3, variant B)
# Self-hosted on this machine: Caddy (entry + HTTPS) + NestJS + Python AI + Redis
# The frontend is prebuilt static files (built in CI/locally and copied into ./web-dist)
# External services (not in this file, called over the network): hosted Supabase / Stripe / Claude
#
# Memory limits sized for a 2 GB host: caddy128 + api400 + ai512 + redis160 ≈ 1.2 GB, leaving about 0.8 GB for the system/peaks.
# Enabling swap first is strongly recommended (see README).

name: nalanda

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web-dist:/srv/web:ro          # Build output (dist) of apps/web
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    mem_limit: 128m
    mem_reservation: 64m

  api:                                  # NestJS core backend
    build:
      context: ../..                    # monorepo root (pnpm workspace)
      dockerfile: infra/hybrid-2g/api.Dockerfile
    # In production, prefer a CI-built image to avoid building on the 2 GB host:
    # image: ghcr.io/<your-org>/nalanda-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai:8000
    depends_on:
      - redis
      - ai
    expose:
      - "3000"                          # Internal only; no published port
    mem_limit: 400m
    mem_reservation: 256m

  ai:                                   # Python FastAPI AI microservice (internal only)
    build:
      context: ../../apps/ai
      dockerfile: ../../infra/hybrid-2g/ai.Dockerfile
    # image: ghcr.io/<your-org>/nalanda-ai:latest
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8000"
    depends_on:
      - redis
    expose:
      - "8000"                          # Called only by NestJS; not exposed
    mem_limit: 512m
    mem_reservation: 320m

  redis:                                # BullMQ queue / cache
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "100mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    mem_limit: 160m
    mem_reservation: 96m

volumes:
  caddy_data:
  caddy_config:
  redis_data:
