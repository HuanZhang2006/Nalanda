<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nalanda — Multi-platform Showcase</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  html,body{ margin:0; height:100%; font-family:"Public Sans",system-ui,sans-serif; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="frames/design-canvas.jsx"></script>
  <script type="text/babel" src="frames/ios-frame.jsx"></script>

  <script type="text/babel">
    const Frame = ({ src, width, height }) => (
      <iframe src={src} title={src}
        style={{ width, height, border: 0, display: 'block', background: '#f1ece2' }} />
    );

    function Showcase(){
      return (
        <DesignCanvas>
          <DCSection id="nalanda" title="Nalanda" subtitle="One learning platform — desktop & mobile. Both are fully clickable; open either fullscreen with the focus button.">
            <DCArtboard id="desktop" label="Desktop — 1440 × 900 · light/dark · Tweaks" width={1440} height={900}>
              <Frame src="Nalanda.html" width={1440} height={900} />
            </DCArtboard>
            <DCArtboard id="mobile" label="Mobile — iPhone" width={402} height={874}>
              <IOSDevice width={402} height={874}>
                <div style={{ height:'100%', boxSizing:'border-box', padding:'50px 0 24px' }}>
                  <Frame src="Nalanda%20Mobile.html" width="100%" height="100%" />
                </div>
              </IOSDevice>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Showcase/>);
  </script>
</body>
</html>
